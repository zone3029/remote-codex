<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Remote Codex Agent</title><link rel="stylesheet" href="style.css"></head>
<body><main><div class="title-row"><div><h1>Remote Codex Agent</h1><p class="hint">此设备仅在使用者明确授权后接受远程管理。</p></div><span id="version" class="version"></span></div><dl><dt>设备 ID</dt><dd id="deviceId">加载中</dd><dt>别称</dt><dd class="alias-control"><input id="deviceAlias" maxlength="64" placeholder="例如：张总电脑"><button id="saveAlias">保存</button><span id="aliasHint"></span></dd><dt>系统服务</dt><dd><span id="systemServiceStatus" class="status">正在检查</span></dd><dt>连接状态</dt><dd><span id="status" class="status">正在连接</span><button id="terminateTask" class="hidden">结束运行中任务</button></dd><dt>软件更新</dt><dd><span id="updateStatus">正在检查</span><button id="installUpdate" class="primary hidden">安装新版本</button><button id="checkUpdate">检查更新</button></dd></dl><section class="computer-use-section"><div class="section-title-row"><h2>Codex 界面控制</h2><label class="switch"><input id="computerUseToggle" type="checkbox"><span></span></label></div><p id="computerUseStatus" class="computer-use-status">未授权</p><p class="section-note">软件启动后默认开启，本机 Codex 可以查看当前桌面并操作鼠标和键盘；可随时手动关闭。</p></section><section class="rdp-section"><h2>远程桌面</h2><div class="rdp-controls"><label>失效时间 <select id="rdpTtl"><option value="1800">30 分钟</option><option value="7200">2 小时</option><option value="43200">12 小时</option><option value="86400">24 小时</option><option value="0" selected>永不失效</option></select></label><button id="startRdp" class="primary">启动远程桌面</button></div><p class="section-note">后台服务启动后会自动建立永久会话；主动关闭后，本次运行期间不再自动启动。</p><p id="rdpStatus" class="rdp-status">正在自动启动永久远程桌面</p><div id="rdpInfo" class="rdp-info hidden"><span>地址 <code id="rdpAddress"></code></span><span>用户名 <code id="rdpUsername"></code></span><span>密码使用此 Windows 账号的登录密码</span><span>失效时间 <time id="rdpExpires"></time></span></div></section><section><h2>处理文件夹</h2><div id="dropzone" class="dropzone"><strong>将需要处理的文件夹拖到这里</strong><span id="workspace">尚未选择文件夹</span></div></section><div class="log-head"><h2>任务日志（含任务输出）</h2><button id="openLog">打开完整日志</button></div><div class="task-log-toolbar"><label for="taskFilter">任务筛选</label><select id="taskFilter"><option value="">全部任务</option></select><span id="taskSummary">暂无任务日志</span></div><pre id="log">暂无任务日志</pre></main><script src="renderer.js"></script></body></html>
