server {
    listen 9443 ssl;
    server_name relay.example.com;

    ssl_certificate /etc/remote-codex/cert.pem;
    ssl_certificate_key /etc/remote-codex/key.pem;

    # Serve large installers directly so update downloads do not traverse the relay process.
    location ^~ /_remote-codex-update-files/ {
        internal;
        alias /www/wwwroot/remote-codex-updates/;
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "no-store";
    }

    # Public, curated download directory. Do not place tokens, update manifests,
    # or device-specific files here; automatic updates continue to use the
    # authenticated route above.
    location ^~ /downloads/remote-codex/ {
        alias /www/wwwroot/remote-codex-downloads/;
        autoindex off;
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        add_header Content-Disposition "attachment";
    }

    location /remote-codex/ {
        proxy_pass http://127.0.0.1:18765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }
}
