# Insert inside the existing server block that listens on 9443.
location = /remote-codex/web-rdp {
    return 301 /remote-codex/web-rdp/;
}

location ^~ /remote-codex/web-rdp/api/ {
    proxy_pass http://127.0.0.1:8180/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

location ^~ /remote-codex/web-rdp/ws {
    proxy_pass http://127.0.0.1:8181/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 12h;
    proxy_send_timeout 12h;
}

location ^~ /remote-codex/web-rdp/ {
    proxy_pass http://127.0.0.1:8180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}
